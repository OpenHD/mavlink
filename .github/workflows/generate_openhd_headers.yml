name: Generate OpenHD headers

on:
  push:
    branches:
      - openhd
    paths:
      - message_definitions/v1.0/openhd.xml
      - pymavlink/**
      - .github/workflows/generate_openhd_headers.yml
  pull_request:
    paths:
      - message_definitions/v1.0/openhd.xml
      - pymavlink/**
      - .github/workflows/generate_openhd_headers.yml

permissions:
  contents: read

jobs:
  generate-openhd:
    name: Generate OpenHD C headers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install future lxml
      - name: Generate OpenHD headers
        run: |
          bash scripts/generate_openhd_headers.sh
      - name: Upload OpenHD headers artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhd-mavlink-headers
          path: generated/include/mavlink/v2.0/openhd
